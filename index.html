<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aufgaben</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
    <header>
        <div class="header-label">Meine</div>
        <h1>Aufgaben</h1>
        <div class="header-date" id="header-date"></div>
    </header>

    <div class="input-row">
        <input type="text" id="new-todo" placeholder="Was möchtest du erledigen?" maxlength="200" />
        <button onclick="addTodo()" aria-label="Hinzufügen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Alle</button>
        <button class="filter-btn" onclick="setFilter('open', this)">Offen</button>
        <button class="filter-btn" onclick="setFilter('done', this)">Erledigt</button>
    </div>

    <div class="todo-list" id="todo-list"></div>

    <div class="footer" id="footer">
        <span id="footer-count"></span>
        <button class="clear-btn" onclick="clearDone()">Erledigte löschen</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>

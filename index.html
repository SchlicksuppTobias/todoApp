<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f5f5f3;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 2rem 1rem;
        }

        #app {
            width: 100%;
            max-width: 520px;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1a1a1a;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        .input-row input {
            flex: 1;
            padding: 8px 12px;
            font-size: 15px;
            border: 1px solid #d0d0cc;
            border-radius: 8px;
            background: #fff;
            color: #1a1a1a;
            outline: none;
            transition: border-color 0.15s;
        }

        .input-row input:focus {
            border-color: #888;
        }

        .input-row input::placeholder {
            color: #aaa;
        }

        .input-row button {
            padding: 8px 16px;
            font-size: 15px;
            border: 1px solid #d0d0cc;
            border-radius: 8px;
            background: #fff;
            color: #1a1a1a;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s;
        }

        .input-row button:hover { background: #f0f0ee; }
        .input-row button:active { transform: scale(0.98); }

        .filters {
            display: flex;
            gap: 6px;
            margin-bottom: 1rem;
        }

        .filter-btn {
            font-size: 13px;
            padding: 4px 14px;
            border-radius: 999px;
            border: 1px solid #d0d0cc;
            background: transparent;
            color: #666;
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-btn.active {
            background: #1a1a1a;
            color: #fff;
            border-color: #1a1a1a;
        }

        .filter-btn:hover:not(.active) { background: #ececea; }

        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid #e8e8e4;
            border-radius: 8px;
            transition: opacity 0.2s;
        }

        .todo-item.done { opacity: 0.55; }
        .todo-item.done .todo-text {
            text-decoration: line-through;
            color: #888;
        }

        .todo-check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1.5px solid #bbb;
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .todo-check.checked {
            background: #1a1a1a;
            border-color: #1a1a1a;
        }

        .todo-check.checked::after {
            content: '';
            width: 4px;
            height: 7px;
            border: 1.5px solid #fff;
            border-top: none;
            border-left: none;
            transform: rotate(45deg) translateY(-1px);
            display: block;
        }

        .todo-text {
            flex: 1;
            font-size: 15px;
            color: #1a1a1a;
        }

        .todo-delete {
            background: none;
            border: none;
            cursor: pointer;
            color: #bbb;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 18px;
            line-height: 1;
            transition: color 0.15s;
            opacity: 0;
        }

        .todo-item:hover .todo-delete { opacity: 1; }
        .todo-delete:hover { color: #e24b4a; }

        .empty {
            text-align: center;
            padding: 2rem;
            color: #aaa;
            font-size: 14px;
        }

        .footer {
            margin-top: 1rem;
            display: none;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #aaa;
        }

        .clear-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            color: #aaa;
            padding: 0;
        }

        .clear-btn:hover { color: #e24b4a; }
    </style>
</head>
<body>
<div id="app">
    <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
        Meine Aufgaben
    </h1>

    <div class="input-row">
        <input type="text" id="new-todo" placeholder="Neue Aufgabe hinzufügen…" maxlength="200" />
        <button onclick="addTodo()">+ Hinzufügen</button>
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="setFilter('all', this)">Alle</button>
        <button class="filter-btn" onclick="setFilter('open', this)">Offen</button>
        <button class="filter-btn" onclick="setFilter('done', this)">Erledigt</button>
    </div>

    <div class="todo-list" id="todo-list"></div>

    <div class="footer" id="footer">
        <span id="footer-count"></span>
        <button class="clear-btn" onclick="clearDone()">Erledigte löschen</button>
    </div>
</div>

<script>
    let todos = [];
    let filter = 'all';
    let nextId = 1;

    function escHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function render() {
        const list = document.getElementById('todo-list');
        const footer = document.getElementById('footer');
        const count = document.getElementById('footer-count');

        const visible = todos.filter(t =>
            filter === 'all' ? true : filter === 'done' ? t.done : !t.done
        );

        list.innerHTML = visible.length === 0
            ? `<div class="empty">${filter === 'done' ? 'Keine erledigten Aufgaben.' : 'Keine Aufgaben vorhanden.'}</div>`
            : visible.map(t => `
          <div class="todo-item${t.done ? ' done' : ''}">
            <div class="todo-check${t.done ? ' checked' : ''}"
              onclick="toggle(${t.id})"
              role="checkbox"
              aria-checked="${t.done}"
              tabindex="0"
              onkeydown="if(event.key==='Enter'||event.key===' ')toggle(${t.id})">
            </div>
            <span class="todo-text">${escHtml(t.text)}</span>
            <button class="todo-delete" onclick="remove(${t.id})" aria-label="Löschen" title="Löschen">&times;</button>
          </div>`).join('');

        const open = todos.filter(t => !t.done).length;
        const done = todos.filter(t => t.done).length;
        footer.style.display = todos.length ? 'flex' : 'none';
        count.textContent = `${open} offen${done ? ' · ' + done + ' erledigt' : ''}`;
    }

    function addTodo() {
        const inp = document.getElementById('new-todo');
        const text = inp.value.trim();
        if (!text) { inp.focus(); return; }
        todos.unshift({ id: nextId++, text, done: false });
        inp.value = '';
        inp.focus();
        render();
    }

    function toggle(id) {
        const t = todos.find(t => t.id === id);
        if (t) t.done = !t.done;
        render();
    }

    function remove(id) {
        todos = todos.filter(t => t.id !== id);
        render();
    }

    function setFilter(f, btn) {
        filter = f;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function clearDone() {
        todos = todos.filter(t => !t.done);
        render();
    }

    document.getElementById('new-todo').addEventListener('keydown', e => {
        if (e.key === 'Enter') addTodo();
    });

    render();
</script>
</body>
</html>
